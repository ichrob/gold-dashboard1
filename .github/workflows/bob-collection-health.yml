name: Bob collection health

on:
  push:
    branches: [main]
  schedule:
    # A short independent watchdog every five minutes. 30-second live polling
    # is performed by Bob, NOT by GitHub Actions.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * 1-5'
    # Monday 00:00 Zurich is Sunday 22:00/23:00 UTC (DST aware below).
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 22,23 * * 0'
  workflow_dispatch:
permissions:
  contents: read

# Important: NEVER keep a scheduled job alive for 60 minutes while dispatching
# more jobs every 5 minutes. GitHub's concurrency queue cancels older pending
# runs, causing gaps and misleading "cancelled" statuses.
# Read-only checks may overlap safely if scheduling is delayed.
jobs:
  collection-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow push deployment to reach both Render services
        if: github.event_name == 'push'
        run: sleep 100
      - name: Respect scheduled Swiss weekend
        id: session
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Europe/Zurich"))
          closed=(now.weekday() in (5,6) or (now.weekday()==4 and now.hour>=23))
          print("open="+str(not closed).lower())
          print("time="+now.isoformat())
          PY
      - name: Check Bob, push, paper accounts and research
        if: steps.session.outputs.open == 'true'
        run: |
          set -euo pipefail
          # A fixed number of bounded retries handles Render free cold starts.
          # Every scheduled run is short; never sleep through the next 5-min slot.
          curl -fsS --max-time 30 --retry 2 --retry-delay 6 --retry-all-errors \
            https://bob-push-service.onrender.com/health -o /tmp/bob-push-health.json
          curl -fsS --max-time 30 --retry 2 --retry-delay 6 --retry-all-errors \
            https://bob-private-scanner.onrender.com/health -o /tmp/bob-health.json
          curl -fsS --max-time 25 --retry 2 --retry-delay 6 --retry-all-errors \
            https://bob-private-scanner.onrender.com/health/background -o /tmp/bob-monitor-health.json
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def read(path):
              with open(path,encoding='utf-8') as f:
                  return json.load(f)
          local=datetime.now(ZoneInfo("Europe/Zurich"))
          active=local.weekday()<5 and 8<=local.hour<22
          research_active=local.weekday()<5 and 8<=local.hour<21
          health=read('/tmp/bob-health.json')
          monitor=read('/tmp/bob-monitor-health.json')
          push=read('/tmp/bob-push-health.json')
          assert push.get('ok') is True, 'Push/database unavailable'
          assert health.get('status')=='ok', 'Bob reports degraded market collection'
          collector=health.get('automaticCollection') or {}
          assert collector.get('enabled') is True and collector.get('running') is True, 'Market collector not running'
          assert monitor.get('status')=='ok', 'Background monitoring cycle stale or failed'
          assert monitor.get('monitorStatus') in ('active','idle','checking'), 'Monitor not reporting a completed cycle'

          research=health.get('strategyResearch') or {}
          assert research.get('enabled') is True and research.get('running') is True, 'Daily strategy research worker stopped'
          if research_active and (local.hour>8 or local.minute>=25):
              assert research.get('phase') not in ('retry','unconfigured','starting'), 'Research failed; waiting for retry'
              assert research.get('lastAttemptAt') is not None, 'Research has not attempted a daily check'

          paper=push.get('paperObservation') or {}
          accounts_total=paper.get('accountsTotal')
          accounts_checked=paper.get('accountsChecked')
          # Five long-running ledgers plus the two registered 1,000-EUR comparison profiles.
          # Permit future additions, but fail if the current inventory shrinks or any profile is unchecked.
          assert isinstance(accounts_total,int) and accounts_total>=7, 'Paper health inventory incomplete'
          assert paper.get('realOrders') is False, 'Paper-only safety marker missing'
          if active:
              if local.hour==8 and local.minute<10:
                  assert paper.get('state') in ('ok','warming'), 'Paper heartbeat unexpected at market open'
              else:
                  assert paper.get('state')=='ok', 'Not all registered paper ledgers are advancing'
                  assert accounts_checked==accounts_total, 'Missing paper-account heartbeat'
                  assert isinstance(paper.get('maxCheckAgeSeconds'),int) and paper['maxCheckAgeSeconds']<=300, 'Paper heartbeat too old'
          else:
              assert paper.get('state')=='paused', 'Off-hours paper should be paused'
          # These are heartbeat checks, NOT validation of real market quotes,
          # independently verified net returns, broker fills or trading success.
          print(f'Bob health checks passed: market, monitor, {accounts_total} paper heartbeats, research worker')
          PY
