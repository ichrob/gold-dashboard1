name: Bob collection health
on:
  push:
    branches: [main]
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bob-collection-health
  cancel-in-progress: false
jobs:
  collection-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify both services and completed background cycle
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 5 https://bob-push-service.onrender.com/health > /tmp/bob-store-health.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://bob-private-scanner.onrender.com/health > /tmp/bob-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/bob-health.json'))
          assert d.get('status')=='ok', 'Bob unavailable'
          c=d.get('automaticCollection',{})
          assert c.get('enabled') is True and c.get('running') is True, 'Automatic collection not running'
          print('Bob automatic collector available; detailed measurements remain private')
          PY
          # A live HTTP listener does not prove the monitor completed its work.
          # Allow cold starts and the first 30-second cycle to finish.
          curl --fail --silent --show-error --max-time 20 --retry 6 --retry-delay 10 --retry-all-errors https://bob-private-scanner.onrender.com/health/background
