name: Bob collection health
on:
  push:
    branches: [main]
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bob-collection-health
  cancel-in-progress: false
jobs:
  collection-health:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Verify both services and completed background cycle
        run: |
          failed=0
          for attempt in $(seq 1 12); do
            echo "Health check ${attempt}/12 at $(date -u +%FT%TZ)"
            if (
          curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 5 https://bob-push-service.onrender.com/health > /tmp/bob-store-health.json || exit 1
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://bob-private-scanner.onrender.com/health > /tmp/bob-health.json || exit 1
          python - <<'PY' || exit 1
          import json
          d=json.load(open('/tmp/bob-health.json'))
          assert d.get('status')=='ok', 'Bob unavailable'
          c=d.get('automaticCollection',{})
          assert c.get('enabled') is True and c.get('running') is True, 'Automatic collection not running'
          print('Bob automatic collector available; detailed measurements remain private')
          PY
          # A live HTTP listener does not prove the monitor completed its work.
          # Allow cold starts and the first 30-second cycle to finish.
          curl --fail --silent --show-error --max-time 20 --retry 6 --retry-delay 10 --retry-all-errors https://bob-private-scanner.onrender.com/health/background
            ); then
              echo "Background checks passed"
            else
              failed=1
              echo "::error::Background health check failed; continuing recovery checks"
            fi
            # Cover delayed scheduler dispatches during the collection window.
            # Outside it, retain the original single check to limit runtime.
            if ! python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo("Europe/Zurich")); raise SystemExit(0 if n.weekday()<5 and 6<=n.hour<22 else 1)'; then
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 300; fi
          done
          exit "$failed"
