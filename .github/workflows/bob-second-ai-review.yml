name: Bob zweite KI - kostenlose Code-Zweitprüfung

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Nummer eines offenen Bob-Pull-Requests"
        required: true
        type: number
  workflow_run:
    workflows: ["Bob CI"]
    types: [completed]

# Trusted main code, never untrusted PR code; no paid fallback.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bob-second-ai-peer-review
  cancel-in-progress: false

jobs:
  review:
    # Automatic review requires two separate opt-ins and a successful PR CI.
    if: >-
      vars.BOB_AI_FREE_ONLY == 'confirmed-workers-free' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.BOB_AI_AUTO_REVIEW_ENABLED == '1' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main, not untrusted PR contents
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Free-tier and safety tests
        run: python -m unittest -v test_ai_peer_review.py test_bob_ai_quality_gate.py
      - name: One bounded Cloudflare review, then one PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOB_AI_FREE_ONLY: ${{ vars.BOB_AI_FREE_ONLY }}
          BOB_AI_AUTO_REVIEW_ENABLED: ${{ vars.BOB_AI_AUTO_REVIEW_ENABLED }}
          BOB_AI_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
          BOB_CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BOB_CF_AI_ACCOUNT_ID: ${{ secrets.BOB_CF_AI_ACCOUNT_ID }}
          BOB_CF_AI_TOKEN: ${{ secrets.BOB_CF_AI_TOKEN }}
          BOB_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
        run: python ai_peer_review.py
