name: Bob zweite KI - kostenlose Code-Zweitprüfung

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Nummer eines offenen Bob-Pull-Requests"
        required: true
        type: number
  workflow_run:
    workflows: ["Bob CI"]
    types: [completed]

# The AI is called through a FREE Worker bound to Workers AI.
# No permanent API key or paid fallback is stored in GitHub.
permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: bob-second-ai-peer-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main code (never PR source)
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Free review safety tests
        run: python -m unittest -v test_ai_peer_review.py test_ai_peer_review_free.py test_bob_ai_quality_gate.py
      - name: One signed GitHub OIDC call to Cloudflare Workers Free
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOB_AI_FREE_ONLY: "confirmed-workers-free"
          BOB_AI_AUTO_REVIEW_ENABLED: "1"
          BOB_AI_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
          BOB_CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BOB_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
        run: python ai_peer_review_free.py
