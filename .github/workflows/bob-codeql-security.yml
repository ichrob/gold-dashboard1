name: Bob Security (CodeQL ohne ChatGPT-Plugin)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bob-codeql-security.yml"
      - "tools/security_*"
      - "requirements-*.txt"
      - "android_companion/**"
      - "bob_mcp.py"
      - "bob_auth.py"
      - "bob_oauth*.py"
      - "server.py"
      - "push_server.py"
      # Manually invoked archive writer/CLI are security-sensitive code paths.
      - "decision_product_pilot.py"
      - "decision_product_pilot_cli.py"
      - "cold_decision_product_writer.py"
      - "cold_decision_products.py"
      - "evidence_archive.py"
      - "drive_evidence_archive.py"
      - "archive_worker.py"
      - "storage_maintenance.py"
      - "storage_budget.py"
      - "storage_layout.py"
      - "storage_forensics.py"
      - "android_image_storage_audit.py"
      - "android_image_reference_shadow.py"
      - "android_image_readthrough.py"
      - "android_image_recovery_bundle.py"
      - "android_image_backup_prepare.py"
      - "test_android_image_backup_prepare.py"
      - "android_image_backup_runner.py"
      - "android_image_pilot_rehearsal.py"
      - "android_image_gc_rehearsal.py"
      - "test_android_image_gc_rehearsal.py"
      - "test_android_image_pilot_rehearsal.py"
      - "android_image_backup_cli.py"
      - "android_image_backup_readiness.py"
      - "test_android_image_backup_readiness.py"
      - "test_android_image_backup_cli.py"
      - "test_android_image_backup_runner.py"
      - "test_android_image_recovery_bundle.py"
      - "test_android_image_readthrough.py"
      - "android_list.py"
      - "handset_list_worker.py"
      - "android_image_persistent_shadow.py"
      - "test_android_image_persistent_shadow.py"
      - "test_android_image_reference_shadow.py"
      - "android_image_reference_codec.py"
      - "test_android_image_reference_codec.py"
      - "test_android_image_storage_audit.py"
      - "test_storage_forensics.py"
      - "test_storage_budget.py"
      - "storage_tail_once.py"
      - "test_storage_tail_once.py"
      - "test_evidence_archive.py"
      - "test_decision_product_pilot*"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: bob-codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: Read-only CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
      - name: Initialize CodeQL (security-extended)
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze source without executing Bob or trading
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
