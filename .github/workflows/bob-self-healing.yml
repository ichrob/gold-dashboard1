name: Bob independent self-healing escalation

on:
  schedule:
    # Short checks; market-specific false alerts are skipped outside Swiss market time.
    - cron: '4,14,24,34,44,54 * * * *'
  # GitHub's scheduled delivery can be delayed. After a successful main CI,
  # wait for the existing checksPass Render rollout and run this same watchdog.
  workflow_run:
    workflows: ["Bob CI"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - bob_problem_mirror.py
      - bob_problems.py
      - bob_issue_watchdog.py
      - .github/workflows/bob-self-healing.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bob-self-healing-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for checksPass Render rollout
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: Checkout monitored build
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe both Render services and file a sanitized KI help issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bob_issue_watchdog.py
