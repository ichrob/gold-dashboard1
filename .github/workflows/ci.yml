name: Bob CI

on:
  push:
    branches: ["main", "ci/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Never cancel an already-running CI job. A newer commit waits instead.
concurrency:
  group: bob-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m py_compile server.py backtest.py

      - name: Validate manifest
        run: python - <<'PY'
import json
from pathlib import Path

manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
required = {"name", "short_name", "start_url", "display"}
missing = sorted(required - manifest.keys())
if missing:
    raise SystemExit(f"manifest.json missing required keys: {', '.join(missing)}")
print("manifest.json: OK")
PY

      - name: Validate required Bob assets
        run: |
          test -s Bob.html
          test -s server.py
          test -s backtest.py
          test -s sw.js
          test -s manifest.json
          test -s icon-192.png
          test -s icon-512.png
          echo "Required Bob assets: OK"

      - name: Validate service worker syntax
        run: node --check sw.js

      - name: Validate Bob JavaScript syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
          node - <<'NODE'
const fs = require("fs");
const vm = require("vm");
const html = fs.readFileSync("Bob.html", "utf8");
const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
if (!scripts.length) throw new Error("No inline Bob script found");
scripts.forEach((code, i) => new vm.Script(code, {filename: `Bob-inline-${i + 1}.js`}));
console.log(`Bob inline JavaScript: OK (${scripts.length} block)`);
NODE

      - name: Validate HTML shell
        run: python - <<'PY'
from html.parser import HTMLParser
from pathlib import Path

class Parser(HTMLParser):
    pass

Parser().feed(Path("Bob.html").read_text(encoding="utf-8"))
print("Bob.html: OK")
PY
