name: Bob CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bob-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile server.py backtest.py
      - name: JSON and Bob validation
        run: node validate_bob.js
      - name: Service worker syntax
        run: node --check sw.js
      - name: Module syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
      - name: Regression tests
        run: node test_bob.js
