name: Bob CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Daily autonomous regression safety checks even on days without commits.
  schedule:
    - cron: '17 5 * * *'

concurrency:
  # Keep PR revisions serial, but isolate each main commit. A stuck older
  # main runner must not block the release gate of a newer, independently tested SHA.
  group: bob-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  # Superseded PR checks may be cancelled; a main commit's own run is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    # Browser tests provision Chromium, Firefox and FFmpeg; avoid cancelling a
    # passing unit-test suite while platform dependencies are still installing.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bob_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOB_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/bob_auth_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-push.txt -r requirements-degiro.txt
      - name: Isolated web deployment encryption dependency
        run: |
          python -m venv /tmp/bob-web-deps
          /tmp/bob-web-deps/bin/python -m pip install --disable-pip-version-check -r requirements-degiro.txt
          PUSH_SERVICE_TOKEN=ci-deployment-test-only /tmp/bob-web-deps/bin/python -c "import snaptrade_bridge as s; c=s.cipher(); assert c.decrypt(c.encrypt(b'deployment-test')) == b'deployment-test'; assert s.diagnostics()['encryptionReady']"
      - name: Python syntax
        run: python -m py_compile server.py backtest.py push_server.py signal_worker.py estimate_quality.py future_analysis.py future_estimate.py product_estimate.py sg_quotes.py product_quotes.py
      - name: VAPID key generation
        run: python -c "from py_vapid import Vapid; v=Vapid(); v.generate_keys(); assert len(v.private_pem()) > 100"
      - name: Automatic collection panel syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from auto_collection import PANEL
          Path('/tmp/bob-auto-ui.js').write_text(re.search(r'<script>(.*)</script>',PANEL,re.S)[1])
          PY
          node --check /tmp/bob-auto-ui.js
      - name: Problem panel JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from bob_problems import PANEL
          script = re.search(r'<script>(.*?)</script>', PANEL, re.S)
          assert script, 'Problem panel script not embedded'
          Path('/tmp/bob-problem-panel.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/bob-problem-panel.js
      - name: JSON and Bob validation
        run: node validate_bob.js
      - name: Service worker syntax
        run: node --check sw.js
      - name: Module syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
          node --check selection_push_evaluator.js
      - name: Python regression tests (including database integration)
        run: python -m unittest discover -p 'test_*.py'
      - name: JavaScript regression tests
        run: |
          for test in test_*.js test_*.cjs; do
            node "$test"
          done

      - name: Browser binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: bob-playwright-linux-1.51.1
      - name: Browser toolchain setup (bounded)
        run: |
          # The Ubuntu runner includes the system libraries/FFmpeg dependencies.
          # Playwright --with-deps would invoke apt to download unrelated fonts
          # and upgrade core system packages; slow mirrors caused exit code 124.
          # Install the same Chromium and Firefox browsers without upgrading apt.
          # Missing libraries or broken browser launch still FAIL the browser tests.
          timeout --signal=TERM --kill-after=10s 240s npm install --prefix /tmp/bob-video-browser --no-package-lock playwright@1.51.1
          timeout --signal=TERM --kill-after=10s 300s /tmp/bob-video-browser/node_modules/.bin/playwright install chromium firefox
          # GitHub's Ubuntu mirror repeatedly stalls while apt-get resolves
          # 99 FFmpeg dependencies. Use imageio-ffmpeg's bundled static binary
          # instead. Still generate the SAME real 640x360, 4-second VP9 WebM.
          # A missing codec or invalid binary fails CI before any browser check.
          timeout --signal=TERM --kill-after=10s 180s python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$FFMPEG_BIN"
          timeout --signal=TERM --kill-after=10s 40s "$FFMPEG_BIN" -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=5 -t 4 -c:v libvpx-vp9 -pix_fmt yuv420p /tmp/bob-video-fixture.webm -y
          test -s /tmp/bob-video-fixture.webm
      - name: Real video file extraction in browser (bounded)
        run: |
          echo "CI browser: browser_video_evidence.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_video_evidence.cjs
          echo "CI browser: browser_mco_illustrations.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_mco_illustrations.cjs
          echo "CI browser: browser_training_help.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_training_help.cjs
          echo "CI browser: browser_paper_priority.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_paper_priority.cjs
          echo "CI browser: browser_self_review.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_self_review.cjs
          echo "CI browser: browser_snaptrade.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_snaptrade.cjs
          echo "CI browser: browser_simple_home.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_simple_home.cjs
          echo "CI browser: browser_unified_workspace.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_unified_workspace.cjs
          echo "CI browser: browser_degiro_export_mobile.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_degiro_export_mobile.cjs
          echo "CI browser: browser_degiro_browser_bridge.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_degiro_browser_bridge.cjs
          echo "CI browser: browser_degiro_browser_bridge.cjs (Firefox)"
          NODE_PATH=/tmp/bob-video-browser/node_modules BOB_BRIDGE_BROWSER=firefox MOZ_DISABLE_CONTENT_SANDBOX=1 timeout --signal=TERM --kill-after=10s 120s node browser_degiro_browser_bridge.cjs
          echo "CI browser: browser_degiro_all_products.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_degiro_all_products.cjs
          echo "CI browser: browser_broker_candidate_pools.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_broker_candidate_pools.cjs
          echo "CI browser: browser_degiro_candidate_image.cjs"
          NODE_PATH=/tmp/bob-video-browser/node_modules timeout --signal=TERM --kill-after=10s 120s node browser_degiro_candidate_image.cjs

  # A fail-closed status for Render's native checksPass auto-deploy mode.
  release-gate:
    name: Bob release gate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete Bob CI
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Blocking Render release: Bob CI is $VALIDATE_RESULT"
            exit 1
          fi
          echo "Bob CI succeeded for commit $GITHUB_SHA; Render may consider this commit."
