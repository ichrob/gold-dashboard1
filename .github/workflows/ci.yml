name: Bob CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bob-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-push.txt
      - name: Python syntax
        run: python -m py_compile server.py backtest.py push_server.py signal_worker.py
      - name: VAPID key generation
        run: python -c "from py_vapid import Vapid; v=Vapid(); v.generate_keys(); assert len(v.private_pem()) > 100"
      - name: JSON and Bob validation
        run: node validate_bob.js
      - name: Service worker syntax
        run: node --check sw.js
      - name: Module syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
      - name: Login and session tests
        run: python -m unittest test_auth.py test_ocr_assets.py
      - name: Regression tests
        run: node test_bob.js
