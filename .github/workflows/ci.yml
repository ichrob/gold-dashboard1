name: Bob CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Daily autonomous regression safety checks even on days without commits.
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: bob-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bob_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOB_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/bob_auth_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-push.txt -r requirements-degiro.txt
      - name: Python syntax
        run: python -m py_compile server.py backtest.py push_server.py signal_worker.py estimate_quality.py future_analysis.py future_estimate.py product_estimate.py sg_quotes.py product_quotes.py
      - name: VAPID key generation
        run: python -c "from py_vapid import Vapid; v=Vapid(); v.generate_keys(); assert len(v.private_pem()) > 100"
      - name: Automatic collection panel syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from auto_collection import PANEL
          Path('/tmp/bob-auto-ui.js').write_text(re.search(r'<script>(.*)</script>',PANEL,re.S)[1])
          PY
          node --check /tmp/bob-auto-ui.js
      - name: Problem panel JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from bob_problems import PANEL
          script = re.search(r'<script>(.*?)</script>', PANEL, re.S)
          assert script, 'Problem panel script not embedded'
          Path('/tmp/bob-problem-panel.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/bob-problem-panel.js
      - name: JSON and Bob validation
        run: node validate_bob.js
      - name: Service worker syntax
        run: node --check sw.js
      - name: Module syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
          node --check selection_push_evaluator.js
      - name: Python regression tests (including database integration)
        run: python -m unittest discover -p 'test_*.py'
      - name: JavaScript regression tests
        run: |
          for test in test_*.js test_*.cjs; do
            node "$test"
          done

      - name: Real video file extraction in browser
        run: |
          npm install --prefix /tmp/bob-video-browser --no-package-lock playwright@1.51.1
          /tmp/bob-video-browser/node_modules/.bin/playwright install --with-deps chromium firefox
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=5 -t 4 -c:v libvpx-vp9 -pix_fmt yuv420p /tmp/bob-video-fixture.webm -y
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_video_evidence.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_mco_illustrations.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_training_help.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_paper_priority.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_snaptrade.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_degiro_export_mobile.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_degiro_browser_bridge.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules BOB_BRIDGE_BROWSER=firefox MOZ_DISABLE_CONTENT_SANDBOX=1 node browser_degiro_browser_bridge.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_degiro_all_products.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_broker_candidate_pools.cjs
          NODE_PATH=/tmp/bob-video-browser/node_modules node browser_degiro_candidate_image.cjs
