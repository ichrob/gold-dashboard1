name: Bob CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bob-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bob_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOB_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/bob_auth_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-push.txt
      - name: Python syntax
        run: python -m py_compile server.py backtest.py push_server.py signal_worker.py estimate_quality.py future_analysis.py future_estimate.py product_estimate.py sg_quotes.py product_quotes.py
      - name: VAPID key generation
        run: python -c "from py_vapid import Vapid; v=Vapid(); v.generate_keys(); assert len(v.private_pem()) > 100"
      - name: Automatic collection panel syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from auto_collection import PANEL
          Path('/tmp/bob-auto-ui.js').write_text(re.search(r'<script>(.*)</script>',PANEL,re.S)[1])
          PY
          node --check /tmp/bob-auto-ui.js
      - name: JSON and Bob validation
        run: node validate_bob.js
      - name: Service worker syntax
        run: node --check sw.js
      - name: Module syntax
        run: |
          node --check push_manager.js
          node --check degiro_assistant.js
          node --check selection_push_evaluator.js
      - name: Login and session tests
        run: python -m unittest test_auth.py test_persistent_auth.py test_auto_collection.py test_market_store.py test_ocr_assets.py test_product_quotes.py test_sg_quotes.py test_sg_futures.py test_future_estimate.py test_gold_api_future.py test_product_estimate.py test_estimate_quality.py test_future_analysis.py test_future_recovery.py test_fibonacci_monitor.py test_push_monitor.py test_background_push.py test_product_push.py test_spot_timestamp.py
      - name: Regression tests
        run: |
          python -m unittest test_decision_audit.py test_economic_calendar.py test_stuttgart_products.py test_public_product_terms.py
          node test_stuttgart_products.js
          node test_sg_numeric_ocr.js
          python -m unittest test_candle_shadow.py test_candle_study.py
          python -m unittest test_source_permission.py test_trade_reference.py
          node test_bob.js
          node test_cost_ranking.js
          node test_selection_flow.js
          node test_selection_push.js
          node test_conditional.js
          node test_manual_import.js
          node test_screenshot_state.js
          node test_combined_reference.js
          node test_exit_estimate.js
          node test_exit_plan.js
          node test_trade_product.js
          node test_trade_upload.js
          python -m unittest test_future_comparison.py test_investing_card.py test_cfd_background.py test_spot_daily_change.py test_market_cards.py test_shared_spot.py test_server_review.py test_background_health.py
          node test_session.js
          node test_market_cards.js
          node test_shared_spot.js
          node test_review.js
          node test_dashboard.js
          node test_quote_refresh.js




