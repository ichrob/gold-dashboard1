name: Bob Android Companion Lab

on:
  pull_request:
    branches: [main]
    paths:
      - "android_companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-lab-build:
    name: Build Android test APK with opt-in diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use runner's installed Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Android platform
        run: |
          "$ANDROID_SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble app and UI test APKs
        run: gradle -p android_companion :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :zentrale:testDebugUnitTest :zentrale:assembleDebug --no-daemon --stacktrace
      - name: Verify parallel test identity and final merged APK permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="android_companion/app/build/outputs/apk/debug/app-debug.apk"
          # A distinct applicationId is essential on devices that already have a
          # differently signed Bob lab APK. Never uninstall the existing app.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/bob-android-badging.txt
          # Debug APK is a separate disposable lab, never a release update.
          grep -Fq "package: name='ch.bob.degirocompanion.stable.voicetest'" /tmp/bob-android-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/bob-android-actual-permissions.txt
          cat /tmp/bob-android-actual-permissions.txt
          for required in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.RECEIVE_BOOT_COMPLETED; do
            grep -Fq "$required" /tmp/bob-android-actual-permissions.txt
          done
          for forbidden in android.permission.SYSTEM_ALERT_WINDOW android.permission.QUERY_ALL_PACKAGES \
                           android.permission.READ_SMS android.permission.READ_CONTACTS; do
            if grep -Fq "$forbidden" /tmp/bob-android-actual-permissions.txt; then
              echo "Forbidden permission in real APK: $forbidden" >&2
              exit 1
            fi
          done
          python - <<'PY'
          from pathlib import Path
          # Offline scripts come from the pinned, signed APK, not network code.
          # A mismatch blocks any lab build and thereby the stable release.
          for name in ("bob_offline_key_escrow.py", "bob_render_to_offline_escrow.py", "bob_termux_runner.py"):
            embedded = Path("android_companion/app/src/main/assets", name).read_bytes()
            original = Path(name).read_bytes()
            assert embedded == original, f"Bundled escrow asset differs: {name}"
          bridge = Path("android_companion/app/src/main/java/ch/bob/degirocompanion/TermuxBridge.kt").read_text()
          assert 'if (isCheck) arguments(Action.CHECK) else localArguments(context)' in bridge
          assert 'putExtra("com.termux.RUN_COMMAND_PENDING_INTENT", pending)' in bridge
          assert 'if (!isCheck)' in bridge
          assert 'python' in bridge.lower()
          manifest = Path("android_companion/app/src/main/AndroidManifest.xml").read_text()
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android.permission.INTERNET' in manifest
          assert 'android.intent.action.SEND' in manifest
          assert 'android:mimeType="image/*"' in manifest
          assert 'android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"' in manifest
          config = Path("android_companion/app/src/main/res/xml/product_reader.xml").read_text()
          assert 'android:canPerformGestures="true"' in config
          assert 'android:canTakeScreenshot="true"' in config
          assert 'android:packageNames="nl.degiro.trader"' in config
          service = Path("android_companion/app/src/main/java/ch/bob/degirocompanion/ProductReadService.kt").read_text()
          assert service.count('dispatchGesture(') == 1
          assert 'action.code=="SEARCH_NO_PROGRESS" && !searchTapAttempted' in service
          assert 'SearchTapPolicy.center(' in service
          print("Final APK checked: opt-in diagnostic transport; explicit read-only product service.")
          PY
      - name: Upload disposable lab APK (NOT an update for Bob – Handy)
        uses: actions/upload-artifact@v4
        with:
          name: bob-android-dev-test-not-an-update
          path: android_companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  workflow-device-test:
    name: Exercise real workflow service on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated fixture and device tests
        run: gradle -p android_companion :workflowfixture:assembleDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Run real service against offline fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Bundled OCR needs no Google Play services. The Google launcher can
          # ANR during first boot and cover every fixture with a system dialog.
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install android_companion/workflowfixture/build/outputs/apk/debug/workflowfixture-debug.apk
            gradle -p android_companion :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ch.bob.degirocompanion.WorkflowDeviceTest --no-daemon --stacktrace
      - name: Retain device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bob-workflow-device-test-reports
          path: |
            android_companion/app/build/reports/androidTests/
            android_companion/app/build/outputs/androidTest-results/
          retention-days: 7
