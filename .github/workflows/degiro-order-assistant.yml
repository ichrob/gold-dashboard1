name: DEGIRO Order Assistant CI

on:
  push:
    branches: [degiro-order-assistant]
  pull_request:
    branches: [degiro-order-assistant]

jobs:
  test-degiro-order-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q test_degiro_order_assistant.py
