name: Bob post-deploy verification (independent)

# Never use push or workflow_run here: a Render checksPass gate must not wait
# for a job that waits for the Render deployment. Periodic read-only checks also cover missing deployment events.
on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: bob-independent-post-deploy
  cancel-in-progress: false

jobs:
  verify-deployed-main:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout verification code
        uses: actions/checkout@v4
      - name: Compare latest CI-approved main with both public health builds
        id: observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.bob_post_deploy_check --github-actions
      - uses: actions/setup-node@v4
        if: steps.observation.outputs.state == 'verified'
        with:
          node-version: '22'
      - name: Exercise verified published ranking scripts
        if: steps.observation.outputs.state == 'verified'
        run: python -m tools.bob_deployed_regressions
