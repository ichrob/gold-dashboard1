name: Bob live smoke test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/bob-live-smoke.yml'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render auto-deploy
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check Bob health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://bob-private-scanner.onrender.com/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Check protected Bob live API
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o /tmp/live.json -w '%{http_code}' https://bob-private-scanner.onrender.com/api/live)"
          test "$code" = "401"
          grep -q "Authentication required" /tmp/live.json
          echo "Bob live API protection OK: unauthenticated request returns 401"

      - name: Verify public manual DEGIRO comparison asset and shell
        run: |
          set -euo pipefail
          asset="https://bob-private-scanner.onrender.com/manual_ranking_order.js?v=20261112-screen-reconcile-v4"
          shell="https://bob-private-scanner.onrender.com/bob-v12"
          # Validate *deployed HTTP*, not source-tree files. A login HTML page
          # with status 200 must not be accepted as a JavaScript module.
          ok=0
          for n in 1 2 3 4; do
            code="$(curl --silent --show-error --max-time 25 -o /tmp/bob-manual.js -D /tmp/bob-manual.headers -w '%{http_code}' "$asset" || true)"
            if [ "$code" = "200" ] &&
               grep -Eiq '^Content-Type: application/javascript' /tmp/bob-manual.headers &&
               grep -Eiq '^X-Content-Type-Options: nosniff' /tmp/bob-manual.headers &&
               grep -Fq 'reconcileBrokerDisplay' /tmp/bob-manual.js &&
               grep -Fq 'root.BobManualTop3=api' /tmp/bob-manual.js; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo "::error::Bob manual comparison module is not served as verified JavaScript"; exit 1; }
          # Bob's full HTML shell is deliberately protected. Without Bob login,
          # a 303 redirect to /login is correct. Never bypass the guard in smoke.
          # A Render edge 502/503 during instance replacement is retryable.
          # Never accept a login page, an unexpected 200/401, or a changed
          # redirect target: only a real HTTP 303 to /login proves the guard.
          shell_ok=0
          for n in 1 2 3 4; do
            code="$(curl --silent --show-error --max-time 25 -o /tmp/bob-shell-redirect -D /tmp/bob-shell.headers -w '%{http_code}' "$shell" || true)"
            if [ "$code" = "303" ]; then
              if grep -Eiq '^Location: /login' /tmp/bob-shell.headers; then
                shell_ok=1
                break
              fi
              echo "::error::Bob shell authentication redirect target changed"
              exit 1
            fi
            case "$code" in
              000|502|503|504)
                if [ "$n" -lt 4 ]; then
                  echo "Bob shell edge temporarily unavailable (HTTP $code; attempt $n)"
                  sleep 5
                  continue
                fi
                ;;
            esac
            echo "::error::Bob shell authentication redirect failed (HTTP $code)"
            exit 1
          done
          test "$shell_ok" = "1" || { echo "::error::Bob shell authentication redirect not verified"; exit 1; }
          echo "Bob manual comparison JavaScript HTTP 200 and protected shell HTTP 303 verified; no broker activity"

      # Render/GitHub auto-deploy verification commit.
