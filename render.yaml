services:
  - type: web
    name: bob-private-scanner
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: echo Bob
    startCommand: python server.py
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PUSH_SERVICE_URL
        fromService:
          name: bob-push-service
          type: web
          property: hostport
      - key: PUSH_SERVICE_TOKEN
        fromService:
          name: bob-push-service
          type: web
          envVarKey: PUSH_SERVICE_TOKEN

  - type: web
    name: bob-push-service
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements-push.txt
    startCommand: python push_server.py
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bob-push-db
          property: connectionString
      - key: PUSH_SERVICE_TOKEN
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:bob@localhost
      - key: BOB_ORIGIN
        value: https://bob-private-scanner.onrender.com

databases:
  - name: bob-push-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
